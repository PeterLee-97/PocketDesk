# Temporary: runs the regression suite on an iPhone simulator for this branch only.
name: Simulator tests (temporary)

on:
  push:
    branches: [claude/tmp-simulator-tests]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run regression tests
        run: |
          set -o pipefail
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          ds = [d for g in json.load(sys.stdin)["devices"].values() for d in g if d["name"].startswith("iPhone")]
          pro = [d for d in ds if "Pro" in d["name"]]
          print((pro or ds)[0]["udid"])')
          xcrun simctl list devices available | grep "$udid"
          xcodebuild test -project PocketDesk.xcodeproj -scheme PocketDesk \
            -destination "id=$udid" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -parallel-testing-enabled NO \
            2>&1 | tee test.log | grep -E "Test Case .*(passed|failed)|error:|Executed|TEST (SUCCEEDED|FAILED)"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-log
          path: test.log
